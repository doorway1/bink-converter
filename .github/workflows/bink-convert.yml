
name: bink-convert

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: "Direct download URL for your MP4"
        required: true
        type: string
      output_name:
        description: "Output filename without extension"
        required: true
        type: string
        default: "output"

jobs:
  convert:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wine wine64 xvfb p7zip-full cabextract file

      - name: Cache RAD Tools
        id: cache
        uses: actions/cache@v4
        with:
          path: radtools-cache
          key: radtools-ubuntu22-dace86bb00b755fea8a0002538fad79e3faebdd6

      - name: Download and verify RAD Tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          mkdir -p RAD-extract radtools-cache

          curl -fL --retry 3 \
            -o RADTools.7z \
            "https://www.radgametools.com/down/Bink/RADTools.7z"

          echo "Verifying official RAD archive checksum..."
          echo "dace86bb00b755fea8a0002538fad79e3faebdd6  RADTools.7z" | sha1sum -c -

          echo "Extracting RAD archive..."
          7z x RADTools.7z -pRAD -y -oRAD-extract

          RAD_INSTALLER=$(find RAD-extract -type f -iname 'radtools.exe' -print -quit)

          if [ -z "$RAD_INSTALLER" ]; then
            echo "Could not find RADTools.exe in downloaded archive."
            find RAD-extract -maxdepth 3 -type f
            exit 1
          fi

          echo "Extracting RAD installer..."
          7z x "$RAD_INSTALLER" -y -oradtools-cache

          RAD_EXE=$(find radtools-cache -type f -iname 'radvideo64.exe' -print -quit)

          if [ -z "$RAD_EXE" ]; then
            echo "Could not find radvideo64.exe."
            find radtools-cache -maxdepth 4 -type f
            exit 1
          fi

          if [ "$RAD_EXE" != "radtools-cache/radvideo64.exe" ]; then
            cp "$RAD_EXE" radtools-cache/radvideo64.exe
          fi

          echo "RAD tools extracted successfully."
          ls -lh radtools-cache/radvideo64.exe

      - name: Validate output name
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          if ! [[ "$OUTPUT_NAME" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Use only letters, numbers, underscores and hyphens in the output name."
            exit 1
          fi

      - name: Start virtual display and initialize Wine
        run: |
          set -euo pipefail

          Xvfb :99 -screen 0 1024x768x24 &
          sleep 2

          export DISPLAY=:99
          export WINEPREFIX="$HOME/.wine"
          export WINEARCH=win64
          export WINEDEBUG=-all

          wineboot --init

          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "WINEPREFIX=$HOME/.wine" >> "$GITHUB_ENV"
          echo "WINEARCH=win64" >> "$GITHUB_ENV"
          echo "WINEDEBUG=-all" >> "$GITHUB_ENV"

      - name: Download MP4
        env:
          INPUT_URL: ${{ inputs.input_url }}
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            --output input.mp4 \
            "$INPUT_URL"

          echo "Downloaded file:"
          ls -lh input.mp4
          file input.mp4

          python3 - <<'PY'
          import sys

          with open("input.mp4", "rb") as f:
              header = f.read(12)

          if len(header) < 8 or header[4:8] != b"ftyp":
              print("Error: downloaded file does not have an MP4 ftyp header.")
              sys.exit(1)

          print("MP4 container header verified.")
          PY

      - name: Copy files into Wine prefix
        env:
          WINEPREFIX: ${{ env.WINEPREFIX }}
        run: |
          set -euo pipefail

          mkdir -p "$WINEPREFIX/drive_c/radtools"

          cp input.mp4 "$WINEPREFIX/drive_c/input.mp4"
          cp radtools-cache/radvideo64.exe "$WINEPREFIX/drive_c/radtools/"

      - name: Show RAD compressor help
        env:
          DISPLAY: :99
          WINEPREFIX: ${{ env.WINEPREFIX }}
          WINEDEBUG: -all
        run: |
          echo "Checking that RAD Video Tools starts..."
          cd "$WINEPREFIX/drive_c"

          timeout 30 wine radtools/radvideo64.exe binkc || true

      - name: Encode Bink 1
        env:
          DISPLAY: :99
          WINEPREFIX: ${{ env.WINEPREFIX }}
          WINEDEBUG: -all
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          set -uo pipefail

          cd "$WINEPREFIX/drive_c"

          echo "Starting Bink 1 compression..."

          timeout 300 wine radtools/radvideo64.exe \
            binkc \
            input.mp4 \
            "${OUTPUT_NAME}.bik" \
            /Bink1 \
            /AutoClose

          if [ ! -s "${OUTPUT_NAME}.bik" ]; then
            echo "Encoding failed: output file was not created."
            ls -lah
            exit 1
          fi

          echo "Output file created:"
          ls -lh "${OUTPUT_NAME}.bik"

      - name: Verify Bink 1 output
        env:
          WINEPREFIX: ${{ env.WINEPREFIX }}
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          set -euo pipefail

          OUTPUT="$WINEPREFIX/drive_c/${OUTPUT_NAME}.bik"

          python3 - "$OUTPUT" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "rb") as f:
              signature = f.read(4)

          print("Bink signature:", signature)

          if signature not in (b"BIKf", b"BIKg", b"BIKh", b"BIKi"):
              print("Error: file does not have a recognized Bink 1 signature.")
              sys.exit(1)

          print("Bink 1 signature verified.")
          PY

      - name: Prepare artifact
        env:
          WINEPREFIX: ${{ env.WINEPREFIX }}
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          set -euo pipefail

          cp "$WINEPREFIX/drive_c/${OUTPUT_NAME}.bik" "./${OUTPUT_NAME}.bik"
          ls -lh "${OUTPUT_NAME}.bik"
          file "${OUTPUT_NAME}.bik"

      - name: Upload Bink file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}.bik
          path: ${{ inputs.output_name }}.bik
          if-no-files-found: error
          retention-days: 30
